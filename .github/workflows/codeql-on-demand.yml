name: CodeQL On Demand

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  codeql-on-mention:
    if: |
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@codeql')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@codeql')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@codeql')) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@codeql') ||
         contains(github.event.issue.title, '@codeql')))
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
      security-events: write
      actions: read
    steps:
      - name: Determine target ref
        id: target-ref
        uses: actions/github-script@v7
        with:
          script: |
            const event = context.eventName;
            let refToUse = context.sha;
            if (event === 'issue_comment' && context.payload.issue?.pull_request) {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.issue.number,
              });
              refToUse = pr.data.head.sha;
            } else if (
              event === 'pull_request_review' ||
              event === 'pull_request_review_comment'
            ) {
              refToUse = context.payload.pull_request.head.sha;
            }
            core.setOutput('ref', refToUse);

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.target-ref.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
