name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        name: bootstrap
        with:
          node-version: 20.x

      - name: Setup yarn version
        run: |-
          corepack enable
          yarn set version 4.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: disable nx cloud
        run: |-
          sudo apt-get update && sudo apt-get install moreutils -y
          jq '.neverConnectToCloud = true' nx.json | sponge nx.json
          jq 'del(.nxCloudId)' nx.json | sponge nx.json

      - name: install
        run: yarn install


      - name: format
        run: yarn nx format:write

      - name: lint
        run: INPUT_GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} yarn nx affected --base=$NX_BASE --head=$NX_HEAD -t lint --parallel=4

      - name: test
        run: INPUT_GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} yarn nx affected --base=$NX_BASE --head=$NX_HEAD -t test -c ci --parallel=1
